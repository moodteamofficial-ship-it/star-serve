# Build + push Star Serve API image for Render (no Cloud Run deploy / migrate).
#
#   gcloud builds submit --project=star-serve-508614 \
#     --config=infra/gcp/cloudbuild-api-render.yaml .
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/star-serve-508614/starserve/api:render
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    dir: backend
    args:
      - build
      - --tag=$_IMAGE
      - .
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - $_IMAGE
images:
  - $_IMAGE
