# Build + deploy Star Serve API to Cloud Run.
# Source root: v1.0 (this file). Image context: backend/.
#
#   gcloud builds submit --project=star-serve-508614 --config=infra/gcp/cloudbuild.yaml \
#     --substitutions=_ENV=staging
#
# Production:
#   gcloud builds submit --project=star-serve-508614 --config=infra/gcp/cloudbuild.yaml \
#     --substitutions=_ENV=production
#
# Secrets are never passed as substitutions. Cloud Run mounts them from Secret Manager.

substitutions:
  _ENV: staging
  _REGION: europe-west1
  _AR_REPO: starserve

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    dir: backend
    args:
      - build
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$BUILD_ID
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$_ENV
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    id: push-env
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$_ENV

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/gcp/*.sh
        scripts/gcp/migrate.sh "$_ENV" "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$BUILD_ID"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/gcp/*.sh
        scripts/gcp/deploy.sh "$_ENV" "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$BUILD_ID"

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$BUILD_ID
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$_ENV
