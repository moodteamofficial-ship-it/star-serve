[project]
name = "starserve"
version = "1.0.0"
description = "Star Serve — multi-tenant insurance management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "PyJWT>=2.10.0",
  "cryptography>=43.0.0",
  "argon2-cffi>=23.1.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "structlog>=24.4.0",
  "ulid-py>=1.1.0",
  "python-multipart>=0.0.17",
  "orjson>=3.10.0",
  "reportlab>=4.2.0",
  "segno>=1.6.0",
  "Pillow>=10.1.0",
  "google-cloud-storage>=2.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "types-redis",
  "testcontainers[postgres,redis]>=4.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
